[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcl"
version = "0.0.1"
description = "Robotics Control Lab: benchmark classical and RL controllers on simulated robots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy>=2", "gymnasium", "sqlalchemy"]

[project.optional-dependencies]
rl = ["stable-baselines3"]
api = ["fastapi", "uvicorn"]
frontend = ["streamlit", "plotly", "httpx"]
tracking = ["mlflow"]
physics = ["pybullet"]  # ADR 0020: optional; wheels only for Linux CPython 3.11, else a C++ build
dev = [
    "pytest", "ruff", "mypy", "import-linter", "pre-commit", "httpx",
    "stable-baselines3", "fastapi", "uvicorn", "streamlit", "plotly", "mlflow",
]

[tool.setuptools.packages.find]
include = ["rcl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"rcl/analytics/report.py" = ["E501"]  # SVG/HTML template strings
"rcl/frontend/pages/*.py" = ["N999"]  # Streamlit page file names start with a digit

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*", "torch.*", "stable_baselines3.*", "uvicorn.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "rcl"

[[tool.importlinter.contracts]]
name = "core imports nothing from the project"
type = "forbidden"
source_modules = ["rcl.core"]
forbidden_modules = [
    "rcl.registry", "rcl.environments", "rcl.controllers", "rcl.perturbations",
    "rcl.ros_adapter", "rcl.experiments", "rcl.metrics", "rcl.analytics", "rcl.persistence",
    "rcl.api", "rcl.frontend",
]

[[tool.importlinter.contracts]]
name = "environments, controllers, perturbations and ros_adapter import only core and registry"
type = "forbidden"
source_modules = [
    "rcl.environments", "rcl.controllers", "rcl.perturbations", "rcl.ros_adapter",
]
forbidden_modules = [
    "rcl.experiments", "rcl.metrics", "rcl.analytics", "rcl.persistence",
    "rcl.api", "rcl.frontend",
]

[[tool.importlinter.contracts]]
name = "registry imports only core"
type = "forbidden"
source_modules = ["rcl.registry"]
forbidden_modules = [
    "rcl.environments", "rcl.controllers", "rcl.perturbations", "rcl.ros_adapter",
    "rcl.experiments", "rcl.metrics", "rcl.analytics", "rcl.persistence", "rcl.api",
    "rcl.frontend",
]

[[tool.importlinter.contracts]]
name = "plugin packages do not import each other"
type = "independence"
modules = ["rcl.environments", "rcl.controllers", "rcl.perturbations", "rcl.ros_adapter"]

[[tool.importlinter.contracts]]
name = "experiments import only core, registry, metrics, persistence"
type = "forbidden"
source_modules = ["rcl.experiments"]
allow_indirect_imports = true  # experiments -> persistence -> ... chains are legal
forbidden_modules = [
    "rcl.environments", "rcl.controllers", "rcl.perturbations", "rcl.ros_adapter",
    "rcl.analytics", "rcl.api", "rcl.frontend",
]

[[tool.importlinter.contracts]]
name = "benchmark CLI imports only experiments, analytics, registry, persistence"
type = "forbidden"
source_modules = ["rcl.benchmark"]
allow_indirect_imports = true
forbidden_modules = [
    "rcl.environments", "rcl.controllers", "rcl.perturbations", "rcl.ros_adapter",
    "rcl.metrics", "rcl.frontend", "rcl.api",
]

[[tool.importlinter.contracts]]
name = "api imports only experiments, analytics, registry, persistence"
type = "forbidden"
source_modules = ["rcl.api"]
allow_indirect_imports = true  # api -> experiments -> metrics is legal; only direct imports break
forbidden_modules = [
    "rcl.environments", "rcl.controllers", "rcl.perturbations", "rcl.ros_adapter",
    "rcl.metrics", "rcl.frontend",
]

[[tool.importlinter.contracts]]
name = "frontend imports no other rcl package (HTTP to api only)"
type = "forbidden"
source_modules = ["rcl.frontend"]
forbidden_modules = [
    "rcl.core", "rcl.registry", "rcl.environments", "rcl.controllers", "rcl.perturbations",
    "rcl.ros_adapter", "rcl.experiments", "rcl.metrics", "rcl.analytics", "rcl.persistence",
    "rcl.api", "rcl.benchmark",
]

[[tool.importlinter.contracts]]
name = "layers depend downward only"
type = "layers"
layers = [
    "rcl.frontend",
    "rcl.api | rcl.benchmark",
    "rcl.experiments",
    "rcl.analytics",
    "rcl.persistence | rcl.metrics",
    "rcl.environments | rcl.controllers | rcl.perturbations | rcl.ros_adapter",
    "rcl.registry",
    "rcl.core",
]
