[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcl"
version = "0.0.1"
description = "Robotics Control Lab: benchmark classical and RL controllers on simulated robots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "gymnasium"]

[project.optional-dependencies]
rl = ["stable-baselines3"]
api = ["fastapi", "uvicorn", "sqlalchemy"]
frontend = ["streamlit", "plotly"]
dev = ["pytest", "ruff", "mypy", "import-linter", "pre-commit", "httpx"]

[tool.setuptools.packages.find]
include = ["rcl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
